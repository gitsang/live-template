services:
  live-template:
    build:
      context: .
      dockerfile: Containerfile
    image: live-template:latest
    container_name: live-template
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8080}:8080'
    environment:
      # 固定时区：弹幕按天落盘依赖本地时间，UTC 会把北京时间 08:00 前的弹幕归到前一天。
      TZ: Asia/Shanghai
      # 支持短号，服务端自动解析
      ROOM_ID: '${ROOM_ID:-90932}'
      # 造弹幕 + 造手柄输入，生产保持 0
      MOCK: '${MOCK:-0}'
      # 调试控制条，OBS 中保持 0
      HUD: '${HUD:-0}'
      # 视频框透明洞，让 OBS 下方的显示器采集透出
      VIDEO_HOLE: '${VIDEO_HOLE:-1}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      # B 站登录态（可选）：留空为匿名（昵称会被打码）。优先用文件，环境变量会进 docker inspect。
      BILI_COOKIE_FILE: '${BILI_COOKIE_FILE:-/run/secrets/bili-cookie.txt}'
      BILI_COOKIE: '${BILI_COOKIE:-}'
      # 网页扫码登录的口令（可选），留空即关闭网页登录、仍可用文件末尾的命令扫码。
      # 要设：图即 qrcode_key，不设口令时同网段的人能取走你正在扫的码并抢走凭据（见 docs/design.md）。
      LOGIN_TOKEN: '${LOGIN_TOKEN:-}'
    volumes:
      - ./data:/app/data
      # 必须**可写**（网页扫码成功后要写回）。别重复挂载同一目标：曾同时有可写 + :ro 两条，
      # Docker 取最后一条使只读生效，写入直接 EROFS。
      - ./secrets:/run/secrets
    # OBS 在宿主机时可用 host 网络，省掉端口映射
    # network_mode: host

# 用 Docker 扫码（不用管理页、宿主机也不用装 Node）。需要 TTY，服务已运行时加 --no-deps：
#
#   docker compose run --rm --no-deps live-template \
#     node build/danmaku/login.js --out /run/secrets/bili-cookie.txt
#
# 不另开 login 服务：那会把 ./secrets 再挂到第二个路径，两边不一致就成了「扫码成功但仍匿名」。

