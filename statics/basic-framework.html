<!DOCTYPE html>
<html lang="zh-CN" class="guide-on label-on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间框体模板 · 像素风 16:9</title>
<style>
/* =============================================================
   像素风直播间框体模板 (OBS 背景底板)
   画布固定 1920×1080，等比缩放铺满窗口
   四个预留框：视频框 / 公告框 / 聊天框 / 手柄操作框

   改版面只需动下面 :root 的数值，视频框会自动重算 16:9
   ============================================================= */

:root{
  --w:1920;            /* 画布宽 */
  --h:1080;            /* 画布高 */
  --pad:28;            /* 画布内边距 */
  --gap:18;            /* 框体间距 */
  --right:480;         /* 右栏宽度 */
  --pad-h:340;         /* 手柄操作框高度 */
  --hd:30;             /* 标题栏高度 */
  --bw:3;              /* 边框宽度（像素块） */

  /* ---- 像素风配色 ---- */
  --page:#05070d;          /* 浏览器留白区 */
  --scene-1:#1b2440;       /* 画布渐变亮部 */
  --scene-2:#0d1120;
  --scene-3:#07090f;
  --panel:#151a2b;         /* 面板底色 */
  --panel-2:#1e2540;       /* 标题栏底色 */
  --edge-lt:#6b7bb5;       /* 亮边框 */
  --edge-dk:#0a0d17;       /* 暗边框 */
  --slot:#000000;          /* 预留区：纯黑 */

  /* ---- 每个框的强调色 ---- */
  --cy:#4de2ff;   /* 视频框 · 青 */
  --yl:#ffd93d;   /* 公告框 · 黄 */
  --gr:#5ef08a;   /* 聊天框 · 绿 */
  --mg:#ff4d9d;   /* 手柄框 · 品红 */
}

/* 透明模式：画布与留白区透明，只留像素外框，供 OBS 叠加 */
html.bg-transparent,
html.bg-transparent body{background:transparent}
html.bg-transparent{--page:transparent}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 缩放容器 ---------- */
.viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.canvas{
  width:1920px;height:1080px;flex:0 0 auto;
  position:relative;overflow:hidden;
  transform-origin:center center;
  background:radial-gradient(125% 95% at 50% 0%, var(--scene-1) 0%, var(--scene-2) 52%, var(--scene-3) 100%);
}
/* CRT 扫描线 */
.canvas::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}
/* 四角像素刻度（装饰） */
.canvas::before{
  content:"";position:absolute;inset:10px;pointer-events:none;z-index:61;
  background:
    linear-gradient(var(--edge-lt),var(--edge-lt)) 0 0/22px 4px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 0 0/4px 22px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 100% 0/22px 4px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 100% 0/4px 22px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 0 100%/22px 4px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 0 100%/4px 22px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 100% 100%/22px 4px no-repeat,
    linear-gradient(var(--edge-lt),var(--edge-lt)) 100% 100%/4px 22px no-repeat;
  opacity:.35;
}
html.bg-transparent .canvas{background:transparent}
html.bg-transparent .canvas::after,
html.bg-transparent .canvas::before{display:none}

/* ---------- 版面 ---------- */
.scene{
  position:absolute;
  inset:calc(var(--pad) * 1px);
  display:flex;gap:calc(var(--gap) * 1px);
}
.col-left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:calc(var(--gap) * 1px)}
.col-right{flex:0 0 calc(var(--right) * 1px);display:flex;flex-direction:column;gap:calc(var(--gap) * 1px)}

/* ---------- 像素面板 ---------- */
.slot{
  position:relative;
  display:flex;flex-direction:column;
  background:var(--panel);
  border:calc(var(--bw) * 1px) solid var(--edge-dk);
  border-radius:0;
  box-shadow:
    0 0 0 calc(var(--bw) * 1px) var(--edge-lt),      /* 外层亮线 */
    8px 8px 0 rgba(0,0,0,.55);                       /* 硬投影 */
}
.slot-video{flex:0 0 auto;height:var(--video-h,801px)}   /* 高度由 JS 按 16:9 精确计算 */
.slot-notice{flex:1 1 auto;min-height:0}
.slot-chat{flex:1 1 auto;min-height:0}
.slot-pad{flex:0 0 calc(var(--pad-h) * 1px)}

/* ---------- 标题栏 ---------- */
.hd{
  position:relative;flex:0 0 calc(var(--hd) * 1px);
  display:flex;align-items:center;gap:10px;
  padding:0 11px;
  background:var(--panel-2);
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.16);
}
/* 底部糖果条（像素虚线） */
.hd::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background-image:repeating-linear-gradient(90deg,
    var(--accent) 0 6px, rgba(0,0,0,.45) 6px 12px);
}
.hd .sprite{flex:0 0 auto;width:22px;height:17px}
.hd .sprite svg{display:block;width:100%;height:100%}
.hd .en{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
  font-size:13px;font-weight:700;letter-spacing:2.6px;
  color:var(--accent);
  text-shadow:2px 2px 0 rgba(0,0,0,.65);
}
.hd .cn{font-size:12.5px;letter-spacing:1.2px;color:rgba(255,255,255,.46)}
.hd .dim{
  margin-left:auto;
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
  font-size:11.5px;letter-spacing:.6px;color:rgba(255,255,255,.34);
  font-variant-numeric:tabular-nums;
}
html.label-off .hd .sprite,
html.label-off .hd .en,
html.label-off .hd .cn{visibility:hidden}

/* ---------- 预留区（纯黑） ---------- */
.body{
  flex:1 1 auto;min-height:0;position:relative;
  background:var(--slot);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);
  overflow:hidden;
}
.slot-video .body{flex:0 0 auto;height:calc(var(--video-h,801px) - var(--hd) * 1px - var(--bw) * 2px)}

/* ---------- 参考线层 ---------- */
.guide{display:none}
html.guide-on .guide{display:block}

.brk{
  position:absolute;width:34px;height:34px;
  border:0 solid var(--accent);opacity:.42;
}
.brk.tl{top:14px;left:14px;border-top-width:4px;border-left-width:4px}
.brk.tr{top:14px;right:14px;border-top-width:4px;border-right-width:4px}
.brk.bl{bottom:14px;left:14px;border-bottom-width:4px;border-left-width:4px}
.brk.br{bottom:14px;right:14px;border-bottom-width:4px;border-right-width:4px}
.slot-notice .brk{width:20px;height:20px}
.slot-notice .brk.tl,.slot-notice .brk.tr{top:10px}
.slot-notice .brk.bl,.slot-notice .brk.br{bottom:10px}

/* 手柄键位底图水印 */
.padhint{position:absolute;inset:0;width:100%;height:100%;opacity:.9}

html.guide-on .slot{outline:1px dashed rgba(255,255,255,.10);outline-offset:-7px}

/* ---------- 控制条（鼠标移动才出现；OBS 不派发鼠标事件） ---------- */
.hud{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  background:rgba(14,17,29,.95);
  border:2px solid var(--edge-dk);
  box-shadow:0 0 0 2px rgba(255,255,255,.12),8px 8px 0 rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:.24s cubic-bezier(.22,1,.36,1);
  z-index:99;font-size:12.5px;
}
.hud.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.hud button{
  height:30px;padding:0 12px;cursor:pointer;
  background:#1b2136;border:2px solid var(--edge-dk);
  box-shadow:0 0 0 2px rgba(255,255,255,.1);
  color:#cfd4e6;font-size:12.5px;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.hud button:hover{background:#252c47;color:#fff}
.hud button.on{
  background:var(--cy);color:#052330;border-color:#0a2a38;
  box-shadow:0 0 0 2px rgba(77,226,255,.45);font-weight:700;
}
.hud .sep{width:2px;height:18px;background:rgba(255,255,255,.14);margin:0 3px}
.hud .tip{color:#868ca4;padding:0 6px;white-space:nowrap}
.hud kbd{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 5px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#c8ccdd;
}
</style>
</head>
<body>

<div class="viewport">
  <div class="canvas" id="canvas">
    <div class="scene">

      <!-- ===== 左栏 ===== -->
      <div class="col-left">

        <div class="slot slot-video" style="--accent:var(--cy)">
          <div class="hd">
            <span class="sprite" data-sprite="screen"></span>
            <b class="en">VIDEO</b>
            <span class="cn">视频框</span>
            <span class="dim guide" data-dim></span>
          </div>
          <div class="body"></div>
        </div>

        <div class="slot slot-notice" style="--accent:var(--yl)">
          <div class="hd">
            <span class="sprite" data-sprite="bell"></span>
            <b class="en">NOTICE</b>
            <span class="cn">公告框</span>
            <span class="dim guide" data-dim></span>
          </div>
          <div class="body"></div>
        </div>

      </div>

      <!-- ===== 右栏 ===== -->
      <div class="col-right">

        <div class="slot slot-chat" style="--accent:var(--gr)">
          <div class="hd">
            <span class="sprite" data-sprite="bubble"></span>
            <b class="en">CHAT</b>
            <span class="cn">聊天框</span>
            <span class="dim guide" data-dim></span>
          </div>
          <div class="body"></div>
        </div>

        <div class="slot slot-pad" style="--accent:var(--mg)">
          <div class="hd">
            <span class="sprite" data-sprite="pad"></span>
            <b class="en">GAMEPAD</b>
            <span class="cn">手柄操作框</span>
            <span class="dim guide" data-dim></span>
          </div>
          <div class="body">
            <!-- 参考线：手柄键位底图 -->
            <svg class="guide padhint" viewBox="0 0 120 76" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">
              <rect x="30" y="20" width="14" height="36" fill="rgba(255,255,255,.10)"/>
              <rect x="19" y="31" width="36" height="14" fill="rgba(255,255,255,.10)"/>
              <rect x="33" y="34" width="8" height="8" fill="rgba(255,255,255,.06)"/>
              <rect x="86" y="24" width="14" height="14" fill="rgba(255,255,255,.10)"/>
              <rect x="102" y="38" width="14" height="14" fill="rgba(255,255,255,.10)"/>
              <rect x="86" y="52" width="14" height="14" fill="rgba(255,255,255,.10)"/>
              <rect x="70" y="38" width="14" height="14" fill="rgba(255,255,255,.10)"/>
              <rect x="52" y="60" width="10" height="4" fill="rgba(255,255,255,.08)"/>
              <rect x="66" y="60" width="10" height="4" fill="rgba(255,255,255,.08)"/>
              <rect x="36" y="14" width="4" height="4" fill="rgba(255,255,255,.20)"/>
              <rect x="36" y="58" width="4" height="4" fill="rgba(255,255,255,.20)"/>
              <rect x="13" y="36" width="4" height="4" fill="rgba(255,255,255,.20)"/>
              <rect x="59" y="36" width="4" height="4" fill="rgba(255,255,255,.20)"/>
            </svg>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- 控制条：仅本地调试用，OBS 浏览器源不会触发 mousemove -->
<div class="hud" id="hud">
  <button id="btnLabel">标签</button>
  <button id="btnGuide">参考线</button>
  <button id="btnBg">透明背景</button>
  <div class="sep"></div>
  <button id="btnCopy">复制 OBS 地址</button>
  <span class="tip" id="tip">OBS 浏览器源：1920 × 1080</span>
  <div class="sep"></div>
  <span class="tip"><kbd>L</kbd> 标签 <kbd>G</kbd> 参考线 <kbd>B</kbd> 背景</span>
</div>

<script>
/* =============================================================
   像素精灵：用 ASCII 点阵定义。'#' = 强调色，'+' = 挖空，'.' = 透明
   想换图案直接改这里的字符画（每行等长即可）
   ============================================================= */
const SPRITES = {
  /* 8×8 老式显示器 */
  screen:[
    "........",
    ".######.",
    ".#....#.",
    ".#.##.#.",
    ".#....#.",
    ".######.",
    "...##...",
    "..####.."
  ],
  /* 8×8 铃铛 */
  bell:[
    "........",
    "...##...",
    "..####..",
    ".######.",
    ".######.",
    ".######.",
    "########",
    "...##..."
  ],
  /* 8×8 对话气泡 */
  bubble:[
    "........",
    ".######.",
    "########",
    "#......#",
    "#.####.#",
    "#......#",
    "########",
    ".##....."
  ],
  /* 12×8 手柄 */
  pad:[
    "............",
    "..########..",
    ".##########.",
    "############",
    "#+##....##+#",
    "############",
    ".##########.",
    "..########.."
  ]
};

/* 点阵 → SVG */
function spriteSVG(name, color, cut){
  const rows = SPRITES[name];
  if(!rows) return '';
  const w = rows[0].length, h = rows.length;
  let out = '';
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const c = rows[y][x];
      if(c === '#')      out += '<rect x="' + x + '" y="' + y + '" width="1.06" height="1.06"/>';
      else if(c === '+') out += '<rect x="' + x + '" y="' + y + '" width="1.06" height="1.06" fill="' + cut + '"/>';
    }
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" fill="' + color + '" shape-rendering="crispEdges"'
       + ' xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + out + '</svg>';
}

/* ============ 状态（支持 URL 参数，便于 OBS 直接引用） ============ */
const q = new URLSearchParams(location.search);
let labelOn     = q.get('label') !== '0';
let guideOn     = q.get('guide') !== '0';
let transparent = ['transparent','none','0'].includes((q.get('bg') || '').toLowerCase());

const root = document.documentElement;
const hud  = document.getElementById('hud');
const CSS  = getComputedStyle(root);

function apply(){
  root.classList.toggle('label-on', labelOn);
  root.classList.toggle('label-off', !labelOn);
  root.classList.toggle('guide-on', guideOn);
  root.classList.toggle('bg-transparent', transparent);
  document.getElementById('btnLabel').classList.toggle('on', labelOn);
  document.getElementById('btnGuide').classList.toggle('on', guideOn);
  document.getElementById('btnBg').classList.toggle('on', transparent);
  document.getElementById('tip').textContent = transparent
    ? '透明模式：OBS 中透明，浏览器里显示为白底'
    : 'OBS 浏览器源：1920 × 1080';
}

/* ============ 注入像素精灵 ============ */
const ACCENT = {'.slot-video':'--cy','.slot-notice':'--yl','.slot-chat':'--gr','.slot-pad':'--mg'};
document.querySelectorAll('[data-sprite]').forEach(function(el){
  const slot = el.closest('.slot');
  const name = el.dataset.sprite;
  const key  = ACCENT['.' + slot.classList[1]];
  el.style.color = 'var(' + (key || '--cy') + ')';
  el.innerHTML = spriteSVG(name, 'currentColor', getComputedStyle(slot).backgroundColor);
});

/* ============ 参考线：四角像素括号 ============ */
document.querySelectorAll('.slot .body').forEach(function(b){
  ['tl','tr','bl','br'].forEach(function(p){
    const d = document.createElement('div');
    d.className = 'guide brk ' + p;
    b.appendChild(d);
  });
});

/* ============ 布局：视频区 16:9 + 画布等比缩放 + 尺寸标注 ============ */
const canvas  = document.getElementById('canvas');
const colLeft = document.querySelector('.col-left');
const slotV   = document.querySelector('.slot-video');

function layout(){
  const bw = parseFloat(CSS.getPropertyValue('--bw')) || 3;
  const hd = parseFloat(CSS.getPropertyValue('--hd')) || 30;

  /* 1) 视频预留区严格 16:9：按左栏可用宽度反推面板高度 */
  const innerW = colLeft.clientWidth - bw * 2;          // 面板内宽 = 预留区宽度
  const videoH = innerW * 9 / 16 + hd + bw * 2;         // 预留区高(16:9) + 标题栏 + 上下边框
  slotV.style.setProperty('--video-h', videoH.toFixed(2) + 'px');

  /* 2) 画布 1920×1080 等比缩放居中（OBS 内 16:9 即 1:1） */
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  canvas.style.transform = 'scale(' + s + ')';

  /* 3) 标注每个预留区的尺寸（画布坐标系 = 1080p 下真实像素，可直接用于对齐采集源） */
  document.querySelectorAll('.slot .body').forEach(function(b){
    const d = b.closest('.slot').querySelector('[data-dim]');
    if(d) d.textContent = Math.round(b.offsetWidth) + '×' + Math.round(b.offsetHeight);
  });
}

/* ============ 控制条：只靠鼠标移动唤出 ============ */
let hideTimer;
function showHud(){
  hud.classList.add('on');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){ hud.classList.remove('on'); }, 2800);
}
window.addEventListener('mousemove', showHud);

/* ============ 操作 ============ */
document.getElementById('btnLabel').addEventListener('click', function(){ labelOn = !labelOn; apply(); showHud(); });
document.getElementById('btnGuide').addEventListener('click', function(){ guideOn = !guideOn; apply(); showHud(); });
document.getElementById('btnBg').addEventListener('click',    function(){ transparent = !transparent; apply(); showHud(); });

document.getElementById('btnCopy').addEventListener('click', function(){
  const p = [];
  if(!labelOn)    p.push('label=0');
  if(!guideOn)    p.push('guide=0');
  if(transparent) p.push('bg=transparent');
  const url = location.origin + location.pathname + (p.length ? '?' + p.join('&') : '');
  const tip = document.getElementById('tip');
  const flash = function(t){ tip.textContent = t; setTimeout(apply, 1700); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      function(){ flash('已复制：' + (p.length ? '?' + p.join('&') : '(默认)')); },
      function(){ flash(url); }
    );
  }else{
    flash(url);
  }
  showHud();
});

window.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  if(k === 'l'){ labelOn = !labelOn; apply(); showHud(); }
  if(k === 'g'){ guideOn = !guideOn; apply(); showHud(); }
  if(k === 'b'){ transparent = !transparent; apply(); showHud(); }
});

/* ============ 启动 ============ */
window.addEventListener('resize', layout);
window.addEventListener('load', layout);
layout();
apply();
</script>
</body>
</html>
